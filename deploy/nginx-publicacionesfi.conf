# Fragmento para INCLUIR dentro del bloque `server { listen 8080; ... }` existente.
# No reemplaza la configuración actual: solo agrega la subruta /publicacionesfi/.

location = /publicacionesfi {
    return 301 /publicacionesfi/;
}

# API → backend Node.js interno (se envía como /api/*)
location /publicacionesfi/api/ {
    proxy_pass http://127.0.0.1:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 25m;   # debe ser >= MAX_UPLOAD_MB del backend
}

# Frontend React compilado
location /publicacionesfi/ {
    alias /var/www/publicacionesfi/public/;
    try_files $uri $uri/ /publicacionesfi/index.html;
}

location /publicacionesfi/assets/ {
    alias /var/www/publicacionesfi/public/assets/;
    expires 30d;
    add_header Cache-Control "public, immutable";
}
